name: Complete Al-Kitaab Part 1 Cedar audio
# Generate only missing Part 1 readings; preserve all existing Cedar recordings.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cedar-vocabulary.yml'
permissions:
  contents: write
concurrency:
  group: cedar-vocabulary
  cancel-in-progress: false
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install audio dependencies
        run: |
          python -m pip install websocket-client==1.8.0
          command -v ffmpeg || (sudo apt-get update && sudo apt-get install -y ffmpeg)
      - name: Export all live vocabulary and validate playback
        run: |
          node scripts/export-cedar-vocabulary.cjs --collection=alkitaab1
          node scripts/check-vocab-audio.cjs
          node scripts/check-module-audio.cjs
          python -m py_compile scripts/cedar_vocabulary.py scripts/cedar_samples.py
      - name: Generate missing Part 1 Cedar vocabulary audio
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python scripts/cedar_vocabulary.py
      - name: Validate complete Part 1 coverage
        run: node scripts/export-cedar-vocabulary.cjs --collection=alkitaab1 --coverage
      - name: Preserve audio and coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mosa-cedar-vocabulary
          path: |
            audio/cedar-vocab/
            cedar-vocab-audio.js
            cedar-vocab-targets.json
          if-no-files-found: ignore
          retention-days: 30
      - name: Save reusable recordings
        if: always()
        run: |
          if [ ! -f audio/cedar-vocab/summary.json ]; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audio/cedar-vocab cedar-vocab-audio.js cedar-vocab-targets.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Save Cedar vocabulary, extended-form, and broken-plural recordings"
          git pull --rebase origin main
          git push origin HEAD:main
