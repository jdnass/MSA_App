name: Review actual Part 1 audio pronunciation
on:
  push:
    branches: ['audio-audit/part1-phonetic']
    paths:
      - '.github/workflows/cedar-part1-phonetic.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 23
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Export scope and validate reviewer syntax
        run: |
          node scripts/export-cedar-vocabulary.cjs --collection=alkitaab1
          python -m py_compile scripts/review_cedar_phonetics.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Review actual MP3 audio and audible word endings
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python scripts/review_cedar_phonetics.py
      - name: Preserve review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cedar-part1-phonetic-review
          path: reports/cedar-part1-phonetic-review.json
          if-no-files-found: warn
      - name: Save review on review branch
        if: always()
        run: |
          if [ ! -f reports/cedar-part1-phonetic-review.json ]; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/cedar-part1-phonetic-review.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Save direct audio-input Part 1 pronunciation review"
          git push origin HEAD:audio-audit/part1-phonetic
