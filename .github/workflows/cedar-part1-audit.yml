name: Audit remaining Part 1 vocabulary audio
on:
  push:
    branches: ['audio-audit/part1']
    paths:
      - '.github/workflows/cedar-part1-audit.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Export Part 1 scope and check audit code
        run: |
          node scripts/export-cedar-vocabulary.cjs --collection=alkitaab1
          python -m py_compile scripts/audit_cedar_part1.py
      - name: Transcribe saved clips and flag possible problems
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python scripts/audit_cedar_part1.py
      - name: Preserve audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cedar-part1-audit
          path: reports/cedar-part1-audit.json
          if-no-files-found: warn
      - name: Save audit report on audit branch
        if: always()
        run: |
          if [ ! -f reports/cedar-part1-audit.json ]; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/cedar-part1-audit.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Save independent Part 1 audio audit"
          git push origin HEAD:audio-audit/part1
