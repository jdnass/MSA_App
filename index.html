{id:'c1-g1',type:'intro',title:'Grammar Lesson Overview',body:`<p>In this lesson, we will discuss nouns, adjectives, and common question words (interrogatives).</p><p>Nouns have four traits that can affect their form: gender, definiteness, quantity, and case. We will focus only on gender and definiteness in this lesson.</p><p>Adjectives in a noun–adjective phrase must match the noun’s gender and definiteness.</p><p>Questions may begin with a question particle. In questions containing a prepositional phrase, the preposition comes first.</p><p>We’ll look at each of these ideas in more detail next.</p>`},
{id:'c1-g2',type:'note',title:'Gender',body:`<p>There are two genders: masculine [مُذَكَّر] (mudhakkar) and feminine [مُؤَنَّث] (muʾannath).</p><p>Feminine nouns can often be identified by a <em>tāʾ marbūṭa</em> [ة], although there are exceptions.</p><p>Human nouns take the gender of the person to whom they refer—for example, father [أَب] and mother [أُمّ]. Inanimate nouns have a fixed grammatical gender—for example, book [كِتاب] is masculine and school [مَدْرَسة] is feminine. Arabic has no neuter pronoun equivalent to “it,” so nonhuman nouns are referred to with he [هُوَ] (huwa) when masculine and she [هِيَ] (hiya) when feminine.</p><p>In a noun–adjective phrase, the noun comes first and the adjective follows its gender: new male student [طالِب جَديد], new female student [طالِبة جَديدة], big house [بَيْت كَبير], and small school [مَدْرَسة صَغيرة].</p>`},
{id:'c1-g3',type:'note',title:'Definiteness',body:`<p>In English, a noun may use the definite article “the,” the indefinite article “a/an,” or no article. Arabic has one definite article [الـ]. When English uses “a/an,” Arabic normally uses no article.</p><p>As with gender, an adjective in a noun–adjective phrase matches the noun’s definiteness. Both words therefore take the definite article in “the new book” [الكِتاب الجَديد].</p>`},
{id:'c1-g4',type:'note',title:'Nisba Adjectives',body:`<p>A nisba adjective expresses origin or association—for example, Egyptian student [طالِب مِصْريّ] and American coffee [قَهْوة أَمْريكيّة]. A phrase such as “library book” is normally expressed with a different structure: book from the library [كِتاب مِنَ المَكْتَبة].</p><p>Nisba adjectives are commonly formed with the suffix [ـِيّ] for masculine nouns and [ـِيّة] for feminine nouns.</p><p>Depending on the base word, forming the nisba may require dropping the definite article, removing a final <em>tāʾ marbūṭa</em>, or removing a final <em>alif</em> [ا]. Examples include French girl [فَتاة فَرَنْسِيّة], the American book [الكِتاب الأَمْريكيّ], and Turkish coffee [قَهْوة تُرْكِيّة].</p>`},
{id:'c1-g5',type:'note',title:'Interrogatives and Prepositional Phrases',body:`<p>In questions containing a prepositional phrase, the preposition comes first and the question word follows it.</p><p>Where are you from? [مِن أَيْنَ أَنْتَ؟]</p><p>In which city do you live? [في أَيِّ مَدينةٍ تَسْكُنُ؟]</p><p>Which street do you live on? [في أَيِّ شارِعٍ تَسْكُنُ؟]</p><p>With whom do you work? [مَعَ مَنْ تَعْمَلُ؟]</p>`},
{id:'c1-g6',type:'note',title:'Choosing “What” and Using هَلْ',body:`<p>Two common ways to ask “what” are [أَيّ] (ayy), used directly before a noun—as in “what/which car?” [أَيُّ سَيّارةٍ؟]—and [ماذا] (mādhā), used before a verb—as in “what are you doing?” [ماذا تَفْعَلُ؟]</p><p>When a question expects a binary answer—such as yes or no, or one option versus another—it can begin with [هَلْ]. For example: “Are you a student?” [هَلْ أَنْتَ طالِبٌ؟] and “Are you a student or a professor?” [هَلْ أَنْتَ طالِبٌ أَمْ أُسْتاذٌ؟]</p>`}
];

</tbody></table>`},
{id:'c2-g3',type:'note',title:'Plural Patterns',body:`<p>Arabic changes the form of a word to indicate quantity. It distinguishes singular, dual, and plural. We will focus on plurals here and return to the dual later.</p><p>In dictionaries and educational materials, [ج] often marks the plural form.</p><p>Arabic has three major plural types:</p><ul class='grammar-list'><li><strong>Masculine sound plurals:</strong> usually [ـُونَ] or [ـِينَ]</li><li><strong>Feminine sound plurals:</strong> usually [ـَاتٌ]</li><li><strong>Broken plurals:</strong> the word’s internal pattern changes</li></ul><p>Masculine sound endings vary with grammatical case, which we will discuss in Chapter 5. Masculine sound plurals are limited to male humans. Feminine sound plurals can describe female humans or nonhuman nouns. Broken plurals may be human or nonhuman.</p>`},
{id:'c2-g4',type:'note',title:'Masculine Sound Plurals',body:`<p>Masculine sound plurals refer to male humans and normally end in [ـُونَ] or [ـِينَ].</p><p>Most human nisba adjectives use this plural:</p><div class='grammar-pair-grid'><div class='grammar-term'>Americans <span class='grammar-ar'>أَمْرِيكِيُّونَ</span></div><div class='grammar-term'>Egyptians <span class='grammar-ar'>مِصْرِيُّونَ</span></div><div class='grammar-term'>Lebanese <span class='grammar-ar'>لُبْنَانِيُّونَ</span></div><div class='grammar-term'>Syrians <span class='grammar-ar'>سُورِيُّونَ</span></div><div class='grammar-term'>Iraqis <span class='grammar-ar'>عِرَاقِيُّونَ</span></div><div class='grammar-term'>Arabs — broken <span class='grammar-ar'>عَرَبٌ</span></div></div><p>Many human participles and profession words beginning with [م] also use it: translators [مُتَرْجِمُونَ], busy [مَشْغُولُونَ], employees [مُوَظَّفُونَ], and specialists [مُتَخَصِّصُونَ].</p><p>Some human adjectives ending in [ـَان] do too, such as tired [تَعْبَانُونَ]. A word can sometimes allow both a sound and a broken plural, such as strange [غَرِيبُونَ / غُرَبَاءُ].</p>`},
{id:'c2-g5',type:'note',title:'Feminine Sound Plurals',body:`<p>Feminine sound plurals can refer to human and nonhuman words. A word ending in [ة] will often replace that ending with [ـَات].</p><div class='grammar-pair-grid'><div class='grammar-term'>cars <span class='grammar-ar'>سَيَّارَاتٌ</span></div><div class='grammar-term'>female teachers <span class='grammar-ar'>مُدَرِّسَاتٌ</span></div><div class='grammar-term'>female students <span class='grammar-ar'>طَالِبَاتٌ</span></div><div class='grammar-term'>universities <span class='grammar-ar'>جَامِعَاتٌ</span></div><div class='grammar-term'>states <span class='grammar-ar'>وِلَايَاتٌ</span></div><div class='grammar-term'>clocks <span class='grammar-ar'>سَاعَاتٌ</span></div><div class='grammar-term'>languages <span class='grammar-ar'>لُغَاتٌ</span></div><div class='grammar-term'>words <span class='grammar-ar'>كَلِمَاتٌ</span></div><div class='grammar-term'>pages <span class='grammar-ar'>صَفَحَاتٌ</span></div></div><div class='grammar-alert'><strong>Watch for broken exceptions:</strong> rooms [غُرَفٌ], families [أُسَرٌ], nations [أُمَمٌ], cats [قِطَطٌ], and sentences [جُمَلٌ].</div>`},
{id:'c2-g6',type:'note',title:'Broken Plurals',body:`<p>Broken plurals do not use the regular masculine or feminine sound endings. Instead, the internal pattern of the singular word changes, sometimes with added letters.</p><p>This category includes human and nonhuman nouns, as well as grammatically masculine and feminine words.</p><div class='grammar-pair-grid'><div class='grammar-term'>books <span class='grammar-ar'>كِتَابٌ <span class='grammar-arrow'>←</span> كُتُبٌ</span></div><div class='grammar-term'>cities <span class='grammar-ar'>مَدِينَةٌ <span class='grammar-arrow'>←</span> مُدُنٌ</span></div><div class='grammar-term'>students <span class='grammar-ar'>طَالِبٌ <span class='grammar-arrow'>←</span> طُلَّابٌ</span></div><div class='grammar-term'>boys <span class='grammar-ar'>وَلَدٌ <span class='grammar-arrow'>←</span> أَوْلَادٌ</span></div><div class='grammar-term'>friends <span class='grammar-ar'>صَدِيقٌ <span class='grammar-arrow'>←</span> أَصْدِقَاءُ</span></div><div class='grammar-term'>names <span class='grammar-ar'>اِسْمٌ <span class='grammar-arrow'>←</span> أَسْمَاءُ</span></div><div class='grammar-term'>grandfathers <span class='grammar-ar'>جَدٌّ <span class='grammar-arrow'>←</span> أَجْدَادٌ</span></div><div class='grammar-term'>things <span class='grammar-ar'>شَيْءٌ <span class='grammar-arrow'>←</span> أَشْيَاءُ</span></div></div>`},
{id:'c2-g7',type:'note',title:'Broken-Plural Patterns',body:`<p>Broken plurals follow several recurring internal patterns. Learning each plural together with its singular is still the safest approach.</p><div class='grammar-pattern'>Common patterns beginning with [أ]</div><div class='grammar-pair-grid'><div class='grammar-term'>news <span class='grammar-ar'>خَبَرٌ <span class='grammar-arrow'>←</span> أَخْبَارٌ</span></div><div class='grammar-term'>friends <span class='grammar-ar'>صَدِيقٌ <span class='grammar-arrow'>←</span> أَصْدِقَاءُ</span></div><div class='grammar-term'>names <span class='grammar-ar'>اِسْمٌ <span class='grammar-arrow'>←</span> أَسْمَاءُ</span></div><div class='grammar-term'>boys <span class='grammar-ar'>وَلَدٌ <span class='grammar-arrow'>←</span> أَوْلَادٌ</span></div></div><div class='grammar-pattern'>Common patterns containing [و]</div><div class='grammar-pair-grid'><div class='grammar-term'>houses <span class='grammar-ar'>بَيْتٌ <span class='grammar-arrow'>←</span> بُيُوتٌ</span></div><div class='grammar-term'>lessons <span class='grammar-ar'>دَرْسٌ <span class='grammar-arrow'>←</span> دُرُوسٌ</span></div><div class='grammar-term'>classes <span class='grammar-ar'>فَصْلٌ <span class='grammar-arrow'>←</span> فُصُولٌ</span></div><div class='grammar-term'>banks <span class='grammar-ar'>بَنْكٌ <span class='grammar-arrow'>←</span> بُنُوكٌ</span></div><div class='grammar-term'>seasons <span class='grammar-ar'>مَوْسِمٌ <span class='grammar-arrow'>←</span> مَوَاسِمُ</span></div></div>`},
{id:'c2-g8',type:'note',title:'Agreement Rules & Examples',body:`<p>Human plural nouns normally take plural adjectives. The noun’s plural type and the adjective’s plural type do not have to match.</p><div class='grammar-example'><strong>The Egyptian translators are busy.</strong><br>[المُتَرْجِمُونَ المِصْرِيُّونَ مَشْغُولُونَ.]</div><div class='grammar-example'><strong>The students are American.</strong><br>[الطُّلَّابُ أَمْرِيكِيُّونَ.]<br><small>“Students” is broken; “American” is a masculine sound plural.</small></div><div class='grammar-example'><strong>The girls are small.</strong><br>[البَنَاتُ صَغِيرَاتٌ.]<br><small>The adjective is feminine and plural.</small></div><div class='grammar-alert'><strong>Important exception:</strong> nonhuman plural nouns take a singular feminine adjective.</div><div class='grammar-example'><strong>The cars are expensive.</strong><br>[السَّيَّارَاتُ غَالِيَةٌ.]</div><div class='grammar-example'><strong>The books are big.</strong><br>[الكُتُبُ كَبِيرَةٌ.]</div>`}
];

['I am a translator and a specialist in the Arabic language.','أَنَا مُتَرْجِمٌ وَمُتَخَصِّصٌ فِي اللُّغَةِ العَرَبِيَّةِ.','anā mutarjimun wa-mutakhaṣṣiṣun fī al-lughati al-ʿarabiyyati.'],
['I am busy and work in the admissions office.','أَنَا مَشْغُولٌ وَأَعْمَلُ فِي مَكْتَبِ القُبُولِ.','anā mashghūlun wa-aʿmalu fī maktabi al-qubūli.'],

['The Middle East Center always opens.','يَفْتَحُ مَرْكَزُ الشَّرْقِ الأَوْسَطِ دَائِمًا.','yaftaḥu markazu al-sharqi al-awsaṭi dāʾiman.',`<p>Note here that “the Middle East” [الشَّرْق الأَوْسَط] is a noun–adjective phrase, so both words take the definite article.</p><p>When it is combined with “center” to form “the Middle East Center” [مَرْكَزُ الشَّرْقِ الأَوْسَطِ], “the Middle East” becomes the second part of an iḍāfa. Therefore, both [الشَّرْقِ] and its adjective [الأَوْسَطِ] are genitive and take kasra. [مَرْكَزُ], the first term of the iḍāfa, takes the case required by the sentence. Here, it is the subject, so it is nominative and takes ḍamma.</p>`],
['It opens in the daytime, the evening, and at night.','يَفْتَحُ فِي النَّهَارِ وَالمَسَاءِ وَاللَّيْلِ.','yaftaḥu fī al-nahāri wa-l-masāʾi wa-l-layli.',`<p>Here, “daytime” [النَّهَارِ], “evening” [المَسَاءِ], and “night” [اللَّيْلِ] are used as nouns. Although they indicate times of day, they are not functioning as adverbs because we have chosen to introduce them with the preposition [فِي]. Therefore, they are in the genitive case and take kasra.</p><p>Because the three nouns are joined together by [وَ], [فِي] does not need to be repeated before each one.</p>`],

const G3=[
{id:'c3-g1',type:'intro',title:'Grammar Overview',body:`<p>In this chapter, we will cover iḍāfa constructions, personal pronoun suffixes, and noun–adjective phrases.</p><ul class='grammar-list'><li>Iḍāfa constructions</li><li>Complex iḍāfa constructions</li><li>Compound words expressed through iḍāfa</li><li>Personal pronouns and possessive suffixes</li><li>Noun–adjective agreement</li></ul>`},
{id:'c3-g2',type:'note',title:'Iḍāfa Construction',body:`<p>An <em>iḍāfa</em> is a possessive construction made from two or more nouns. It often corresponds to English “X of Y” or “Y’s X.”</p><p>The thing being possessed comes first. This is X in “X of Y” and the noun after the apostrophe in “Y’s X.” The first noun is in the <strong>construct state</strong>: it does not take the definite article [الـ] or tanwīn. The possessor follows it and is genitive.</p><p>An iḍāfa may be definite or indefinite. In the definite examples below, the final noun makes the whole construction definite because it has [الـ], is a proper noun, or has a possessive suffix.</p><div class='grammar-pair-grid'><div class='grammar-term'>the admissions office <span class='grammar-ar'>مَكْتَبُ القُبُولِ</span></div><div class='grammar-term'>University of Michigan <span class='grammar-ar'>جَامِعَةُ مِيشِيغَانَ</span></div><div class='grammar-term'>Mohammed’s mom <span class='grammar-ar'>أُمُّ مُحَمَّدٍ</span></div><div class='grammar-term'>the uncle’s son <span class='grammar-ar'>ابْنُ العَمِّ</span></div><div class='grammar-term'>picture of my mom <span class='grammar-ar'>صُورَةُ أُمِّي</span></div></div><p>An adjective placed after an iḍāfa agrees with the first noun—the thing possessed—in gender, number, and case. Its definiteness matches the whole iḍāfa.</p><div class='grammar-example'><strong>the new train station</strong><br>[مَحَطَّةُ القِطَارِ الجَدِيدَةُ]</div><div class='grammar-example'><strong>the old car keys</strong><br>[مَفَاتِيحُ السَّيَّارَةِ القَدِيمَةُ]</div>`},
{id:'c3-g3',type:'note',title:'Complex Iḍāfa',body:`<p>A complex iḍāfa contains three or more nouns. Every noun except the final possessor is in the construct state, so it takes neither [الـ] nor tanwīn. The final noun determines whether the whole construction is definite.</p><div class='grammar-example'><strong>Mohammed’s father’s male paternal cousin</strong><br>[ابْنُ عَمِّ وَالِدِ مُحَمَّدٍ]</div><p>Read the chain from right to left: Mohammed [مُحَمَّدٍ] → Mohammed’s father [وَالِدِ مُحَمَّدٍ] → Mohammed’s father’s paternal cousin [ابْنُ عَمِّ وَالِدِ مُحَمَّدٍ].</p>`},
{id:'c3-g4',type:'note',title:'Compound Words',body:`<p>English compound words are often expressed in Arabic with an iḍāfa because the two nouns are linked: the first noun names the thing, and the second specifies its type.</p><div class='grammar-pair-grid'><div class='grammar-term'>car key <span class='grammar-ar'>مِفْتَاحُ السَّيَّارَةِ</span></div><div class='grammar-term'>train station <span class='grammar-ar'>مَحَطَّةُ القِطَارِ</span></div></div><p>The same iḍāfa rules apply: the first noun has no [الـ] or tanwīn, and the second noun is genitive.</p>`},
{id:'c3-g5',type:'note',title:'Personal Pronouns',body:`<p>To show possession with a personal pronoun, attach the appropriate suffix to the noun. The independent pronoun and the possessive suffix are shown in red below.</p><p>If a noun ends in <em>tāʾ marbūṭa</em> [ة], it changes to a regular <em>tāʾ</em> [ت] before the suffix: family [أُسْرَةٌ] → your nuclear family [أُسْرَتُكَ النَّوَوِيَّةُ].</p><table class='conjugation-table' aria-label='Personal pronouns and possessive suffixes using house'><tbody>
<tr><td><div class='conjugation-ar'><span class='conjugation-red'>أَنَا</span> بَيْت<span class='conjugation-red'>ِي</span></div><span class='conjugation-en'>my house</span></td><td><div class='conjugation-ar'><span class='conjugation-red'>نَحْنُ</span> بَيْتُ<span class='conjugation-red'>نَا</span></div><span class='conjugation-en'>our house</span></td></tr>
<tr><td><div class='conjugation-ar'><span class='conjugation-red'>أَنْتَ</span> بَيْتُ<span class='conjugation-red'>كَ</span></div><span class='conjugation-en'>your (male) house</span></td><td><div class='conjugation-ar'><span class='conjugation-red'>أَنْتُمْ</span> بَيْتُ<span class='conjugation-red'>كُمْ</span></div><span class='conjugation-en'>your all (male/mixed) house</span></td></tr>
<tr><td><div class='conjugation-ar'><span class='conjugation-red'>أَنْتِ</span> بَيْتُ<span class='conjugation-red'>كِ</span></div><span class='conjugation-en'>your (female) house</span></td><td><div class='conjugation-ar'><span class='conjugation-red'>أَنْتُنَّ</span> بَيْتُ<span class='conjugation-red'>كُنَّ</span></div><span class='conjugation-en'>your all (female) house</span></td></tr>
<tr><td><div class='conjugation-ar'><span class='conjugation-red'>هُوَ</span> بَيْتُ<span class='conjugation-red'>هُ</span></div><span class='conjugation-en'>his house</span></td><td><div class='conjugation-ar'><span class='conjugation-red'>هُمْ</span> بَيْتُ<span class='conjugation-red'>هُمْ</span></div><span class='conjugation-en'>their (male/mixed) house</span></td></tr>
<tr><td><div class='conjugation-ar'><span class='conjugation-red'>هِيَ</span> بَيْتُ<span class='conjugation-red'>هَا</span></div><span class='conjugation-en'>her house</span></td><td><div class='conjugation-ar'><span class='conjugation-red'>هُنَّ</span> بَيْتُ<span class='conjugation-red'>هُنَّ</span></div><span class='conjugation-en'>their (female) house</span></td></tr>
</tbody></table>`},
{id:'c3-g6',type:'note',title:'Adjective Phrases',body:`<p>A noun–adjective phrase consists of a noun followed by an adjective that describes it.</p><p>The adjective agrees with the noun in gender, number under the relevant agreement rules, definiteness, and case.</p><div class='grammar-pair-grid'><div class='grammar-term'>the big house <span class='grammar-ar'>البَيْتُ الكَبِيرُ</span></div><div class='grammar-term'>the nice car <span class='grammar-ar'>السَّيَّارَةُ الجَمِيلَةُ</span></div><div class='grammar-term'>the big houses <span class='grammar-ar'>البُيُوتُ الكَبِيرَةُ</span></div><div class='grammar-term'>the nice cars <span class='grammar-ar'>السَّيَّارَاتُ الجَمِيلَةُ</span></div></div><div class='grammar-alert'><strong>Remember:</strong> nonhuman plural nouns take a singular feminine adjective. That is why “big” and “nice” appear as [الكَبِيرَةُ] and [الجَمِيلَةُ] with the nonhuman plurals “houses” and “cars.”</div>`}
];

['Now I study history and law at the college.','الآنَ أَدْرُسُ التَّارِيخَ وَالحُقُوقَ فِي الكُلِّيَّةِ.','al-āna adrusu al-tārīkha wa-l-ḥuqūqa fī al-kulliyyati.',`<p>The word [الآنَ] (“now”) always has a fixed fatḥa at the end, regardless of where it appears in the sentence. Grammatically, it functions as an adverb of time.</p>`],
['I also study political science, anthropology, and psychology.','أَدْرُسُ أَيْضًا العُلُومَ السِّيَاسِيَّةَ وَعِلْمَ الإِنْسَانِ وَعِلْمَ النَّفْسِ.','adrusu ayḍan al-ʿulūma al-siyāsiyyata wa-ʿilma al-insāni wa-ʿilma al-nafsi.',`<p>“Political science” [العُلُوم السِّيَاسِيَّة] is a noun–adjective phrase, while “anthropology” [عِلْم الإِنْسَان] and “psychology” [عِلْم النَّفْس] are iḍāfa constructions. You can recognize the difference from the placement of the definite articles.</p><p>Both the noun and adjective in “political science” take the case required by their role in the sentence. Here, [العُلُومَ السِّيَاسِيَّةَ] is a direct object, so both words are accusative. In each iḍāfa, the first term takes the case required by the sentence, while the second term is genitive. Therefore, we have [عِلْمَ الإِنْسَانِ] and [عِلْمَ النَّفْسِ].</p>`],
['I teach religion and science at the college.','أُدَرِّسُ الدِّينَ وَالعِلْمَ فِي الكُلِّيَّةِ.','udarrisu al-dīna wa-l-ʿilma fī al-kulliyyati.'],
['My son studies medicine and engineering.','اِبْنِي يَدْرُسُ الطِّبَّ وَالهَنْدَسَةَ.','ibnī yadrusu al-ṭibba wa-l-handasata.'],
['My grandfather was an officer in the army.','كَانَ جَدِّي ضَابِطًا فِي الجَيْشِ.','kāna jaddī ḍābiṭan fī al-jayshi.',`<p>The word [ضَابِطًا] is accusative because it is the predicate of [كَانَ] (remember: kāna and its sisters). Because it is indefinite, it takes fatḥatan [ـً]. An extra [ا] is usually written after fatḥatan when the word does not end in [ة] or a final hamza already preceded by [ا].</p>`],
['I have a letter and a picture from my grandmother.','عِنْدِي رِسَالَةٌ وَصُورَةٌ مِنْ جَدَّتِي.','ʿindī risālatun wa-ṣūratun min jaddatī.',`<p>English says “I have a letter and a picture,” with “I” as the subject of the verb “have.” Arabic expresses this more like “With me are a letter and a picture.” [عِنْدِي] means “with me / in my possession”: the [ـي] means “me,” but “I” is not the grammatical subject here. [عِنْدِي] serves as the fronted predicate, while [رِسَالَةٌ] (“letter”) and [صُورَةٌ] (“picture”) are delayed subjects. That is why both nouns are nominative [ـٌ], not accusative direct objects.</p>`],
['My paternal uncle has a son, and he is my cousin.','لِعَمِّي اِبْنٌ، وَهُوَ اِبْنُ عَمِّي.','li-ʿammī ibnun, wa-huwa ibnu ʿammī.',`<p>In [لِعَمِّي ابْنٌ], [لِـ] is a preposition expressing possession. The whole phrase [لِعَمِّي] (“belonging to my paternal uncle”) serves as the fronted predicate, while [ابْنٌ] (“a son”) is the delayed subject and is therefore nominative. This works like [عِنْدِي رِسَالَةٌ] (“I have a letter”): the person who has something appears in the opening phrase, rather than as the Arabic sentence’s subject. [ابْنُ عَمِّي] literally means “my paternal uncle’s son”—that is, “my cousin.”</p>`],
['The husband is married, and the wife is married.','الزَّوْجُ مُتَزَوِّجٌ وَالزَّوْجَةُ مُتَزَوِّجَةٌ.','al-zawju mutazawwijun wa-l-zawjatu mutazawwijatun.'],
['How many relatives are in your extended family?','كَمْ قَرِيبًا فِي عَائِلَتِكَ؟','kam qarīban fī ʿāʾilatika?',`<p>After the question word [كَمْ] (“how many?”), the thing being counted is normally singular, indefinite, and accusative. This is called the specification (tamyīz). So Arabic uses [قَرِيبًا]—literally “how many relative?”—even though natural English says “how many relatives?” The fatḥatan [ـً] marks the indefinite accusative, and the final [ا] follows the usual spelling rule.</p>`],

['I eat fruits and vegetables every day.','آكُلُ الفَواكِهَ وَالخُضارَ كُلَّ يَوْمٍ.','ākulu al-fawākiha wa-l-khuḍāra kulla yawmin.',`<p>“Every day” is an iḍāfa phrase:</p><div class='grammar-note-ar' dir='rtl' lang='ar'>كُلَّ يَوْمٍ</div><p>The first word, “every,” takes a fatḥa because the phrase tells us when the action happens. The second word, “day,” is indefinite and the second part of the iḍāfa, so it takes a double kasra.</p>`],
['I like all sweets.','أُحِبُّ كُلَّ الحَلَوِيّاتِ.','uḥibbu kulla al-ḥalawiyyāti.',`<p>“All sweets” is an iḍāfa, like “every day”:</p><div class='grammar-note-ar' dir='rtl' lang='ar'>كُلَّ الحَلَوِيّاتِ</div><p>Here the phrase is the direct object of “I like,” so “all” takes a fatḥa. “Sweets” takes a kasra because it is the second part of the iḍāfa.</p>`],

['Does the restaurant have salad and soup?','هَلِ المَطْعَمُ عِنْدَهُ سَلَطةٌ وَشورْبةٌ؟','hal al-maṭʿamu ʿindahu salaṭatun wa-shūrbatun?',`<p>When asking whether a restaurant has something available, Arabic commonly uses the indefinite forms:</p><div class='grammar-note-ar' dir='rtl' lang='ar'>سَلَطةٌ وَشورْبةٌ</div><p>Here they mean “any salad and soup.” Definite forms would point to particular dishes already in context.</p>`],
['I am traveling from America to Lebanon.','أُسافِرُ مِن أَمريكا إِلى لُبْنان.','usāfiru min amrīkā ilā lubnān.',`<p>“From” makes “America” genitive, which normally calls for a kasra:</p><div class='grammar-note-ar' dir='rtl' lang='ar'>مِن أَمريكا</div><p>But “America” ends in a long ā sound, so that case vowel cannot be pronounced or written. The genitive kasra is understood even though the ending does not visibly change.</p>`],

['I remember the elementary school from my childhood like it was yesterday.','أَتَذَكَّر المَدْرَسَةَ الاِبْتِدائِيَّةَ مِن طُفولَتي كَأَنَّها كانَتْ أَمْسِ.','atadhakkar al-madrasata al-ibtidāʾiyyata min ṭufūlatī kaʾannahā kānat amsi.',`<p>“Elementary school” is a noun–adjective phrase, not an iḍāfa:</p><div class='grammar-note-ar' dir='rtl' lang='ar'>المَدْرَسَةَ الاِبْتِدائِيَّةَ</div><p>“Elementary” describes “school,” so both words are definite and take the same accusative ending as the direct object of “I remember.” “Yesterday” keeps a fixed kasra; it is part of this word’s form, not a case ending that changes with its role:</p><div class='grammar-note-ar' dir='rtl' lang='ar'>أَمْسِ</div>`],

{id:'c4-g1',type:'intro',title:'Grammar Overview',body:`<p>In this lesson, we will cover negation of present-tense verbs, object pronouns, word roots and patterns, and direct objects.</p><ul class='grammar-list'><li>Present-tense negation</li><li>Object pronouns attached to verbs</li><li>Roots and word patterns</li><li>Verb Forms I, II, III, and V</li></ul>`},
{id:'c4-g2',type:'note',title:'Present-Tense Negation',body:`<p>Negating a present-tense verb is easy: place [لَا] directly before it and keep the present-tense verb as it is.</p><div class='grammar-pair-grid'><div class='grammar-term'>I don’t remember. <span class='grammar-ar'>لَا أَتَذَكَّرُ.</span></div><div class='grammar-term'>I don’t eat. <span class='grammar-ar'>لَا آكُلُ.</span></div></div><p>You can also turn this negative statement into a yes-or-no question meaning “Don’t …?” by adding the question hamza [أَ] before [لَا]. Together they are written [أَلَا].</p><div class='grammar-example'><strong>Don’t you know English?</strong><br>[أَلَا تَعْرِفُ الإِنْجِلِيزِيَّةَ؟]</div>`},
{id:'c4-g3',type:'note',title:'Object Pronouns',body:`<p>An object pronoun is attached to a verb and receives the verb’s action. This differs from a possessive pronoun, which attaches to a noun.</p><div class='grammar-pair-grid'><div class='grammar-term'>I love you. <span class='grammar-ar'>أُحِبُّكَ.</span></div><div class='grammar-term'>I am reading a book. <span class='grammar-ar'>أَقْرَأُ كِتَابًا.</span></div><div class='grammar-term'>I know her. <span class='grammar-ar'>أَعْرِفُهَا.</span></div><div class='grammar-term'>He teaches us. <span class='grammar-ar'>يُدَرِّسُنَا.</span></div></div><p>Object-pronoun suffixes are almost the same as possessive suffixes. The main difference is “me”: the object suffix is [ـنِي], with an added [ن]. First conjugate the verb completely for its subject; then attach the suffix that matches the object’s gender and number. For people, it matches the person. For things, it matches the noun’s fixed grammatical gender.</p><table class='conjugation-table' aria-label='Object-pronoun suffixes using he knows'><tbody>
<tr><td><div class='conjugation-ar'><span class='conjugation-red'>أَنَا</span> يَعْرِفُ<span class='conjugation-red'>نِي</span></div><span class='conjugation-en'>he knows me</span></td><td><div class='conjugation-ar'><span class='conjugation-red'>نَحْنُ</span> يَعْرِفُ<span class='conjugation-red'>نَا</span></div><span class='conjugation-en'>he knows us</span></td></tr>
<tr><td><div class='conjugation-ar'><span class='conjugation-red'>أَنْتَ</span> يَعْرِفُ<span class='conjugation-red'>كَ</span></div><span class='conjugation-en'>he knows you (male)</span></td><td><div class='conjugation-ar'><span class='conjugation-red'>أَنْتُمْ</span> يَعْرِفُ<span class='conjugation-red'>كُمْ</span></div><span class='conjugation-en'>he knows you all (male/mixed)</span></td></tr>
<tr><td><div class='conjugation-ar'><span class='conjugation-red'>أَنْتِ</span> يَعْرِفُ<span class='conjugation-red'>كِ</span></div><span class='conjugation-en'>he knows you (female)</span></td><td><div class='conjugation-ar'><span class='conjugation-red'>أَنْتُنَّ</span> يَعْرِفُ<span class='conjugation-red'>كُنَّ</span></div><span class='conjugation-en'>he knows you all (female)</span></td></tr>
<tr><td><div class='conjugation-ar'><span class='conjugation-red'>هُوَ</span> يَعْرِفُ<span class='conjugation-red'>هُ</span></div><span class='conjugation-en'>he knows him</span></td><td><div class='conjugation-ar'><span class='conjugation-red'>هُمْ</span> يَعْرِفُ<span class='conjugation-red'>هُمْ</span></div><span class='conjugation-en'>he knows them (male/mixed)</span></td></tr>
<tr><td><div class='conjugation-ar'><span class='conjugation-red'>هِيَ</span> يَعْرِفُ<span class='conjugation-red'>هَا</span></div><span class='conjugation-en'>he knows her</span></td><td><div class='conjugation-ar'><span class='conjugation-red'>هُنَّ</span> يَعْرِفُ<span class='conjugation-red'>هُنَّ</span></div><span class='conjugation-en'>he knows them (female)</span></td></tr>
</tbody></table>`},
{id:'c4-g4',type:'note',title:'Roots and Word Patterns',body:`<p>Arabic words are often linked by a set of root consonants. The traditional pattern template is [ف ع ل]: [ف] stands for the first root letter, [ع] for the second, and [ل] for the third.</p><p>A pattern supplies the vowels and any extra letters. To apply it, replace [ف ع ل] with the root letters while keeping the rest of the pattern.</p><p>For example, office, book, library, and “to write” all share the root [ك ت ب], which carries the general idea of writing:</p><div class='grammar-pair-grid'><div class='grammar-term'>office <span class='grammar-ar'>مَكْتَب</span></div><div class='grammar-term'>book <span class='grammar-ar'>كِتَاب</span></div><div class='grammar-term'>library <span class='grammar-ar'>مَكْتَبَة</span></div><div class='grammar-term'>to write / he wrote <span class='grammar-ar'>كَتَبَ</span></div></div><p>The extra letters and vowel pattern help distinguish the words’ meanings. Recognizing a familiar root can therefore help you infer the general idea of a word you have never seen.</p>`},
{id:'c4-g5',type:'note',title:'Form I: The Base Form',body:`<p>Form I is the base verb form. Its core consists of the root consonants, with the normal person prefix or suffix added during conjugation.</p><p>In the present tense, Form I commonly appears in three patterns. The vowel on the middle root consonant changes, so the present-tense pattern must be learned with each verb.</p><div class='grammar-pattern'>[يَفْعُلُ] — middle vowel [ـُ]</div><div class='grammar-pair-grid'><div class='grammar-term'>he eats <span class='grammar-ar'>يَأْكُلُ</span></div><div class='grammar-term'>he writes <span class='grammar-ar'>يَكْتُبُ</span></div><div class='grammar-term'>he lives <span class='grammar-ar'>يَسْكُنُ</span></div></div><div class='grammar-pattern'>[يَفْعَلُ] — middle vowel [ـَ]</div><div class='grammar-pair-grid'><div class='grammar-term'>he works <span class='grammar-ar'>يَعْمَلُ</span></div><div class='grammar-term'>he memorizes <span class='grammar-ar'>يَحْفَظُ</span></div><div class='grammar-term'>he reads <span class='grammar-ar'>يَقْرَأُ</span></div></div><div class='grammar-pattern'>[يَفْعِلُ] — middle vowel [ـِ]</div><div class='grammar-pair-grid'><div class='grammar-term'>he knows <span class='grammar-ar'>يَعْرِفُ</span></div></div>`},
{id:'c4-g6',type:'note',title:'Form II: The Causative Form',body:`<p>Form II has the present-tense pattern [يُفَعِّلُ]. Its defining feature is the shadda on the second root consonant.</p><p>Form II often has a causative or intensive meaning: the subject causes someone or something to undergo the action. This is a common tendency, not an absolute rule.</p><div class='grammar-pair-grid'><div class='grammar-term'>he teaches <span class='grammar-ar'>يُدَرِّسُ</span></div><div class='grammar-term'>he takes a picture <span class='grammar-ar'>يُصَوِّرُ</span></div></div><p>Teaching causes someone to study; taking a picture directs the action toward someone or something being photographed.</p>`},
{id:'c4-g7',type:'note',title:'Form III: With Something',body:`<p>Form III has the present-tense pattern [يُفَاعِلُ]. It is formed with an [ا] after the first root consonant.</p><p>Form III often suggests participation, interaction, or an action involving someone or something else. This is a helpful tendency rather than a rule that predicts every verb’s meaning.</p><div class='grammar-pair-grid'><div class='grammar-term'>he travels <span class='grammar-ar'>يُسَافِرُ</span></div><div class='grammar-term'>he watches <span class='grammar-ar'>يُشَاهِدُ</span></div></div><p>In the first example, he travels to a place; in the second, he watches someone or something.</p>`},
{id:'c4-g8',type:'note',title:'Form V: The Reflexive Form',body:`<p>We are skipping Form IV for now because we have not yet covered a verb in that form.</p><p>Form V has the present-tense pattern [يَتَفَعَّلُ]. It is closely related to Form II but adds [ت] before the root. Form V often carries a reflexive or middle meaning—an action that turns back toward, affects, or develops within the subject.</p><div class='grammar-example'><strong>he remembers</strong><br>[يَتَذَكَّرُ]</div><p>Here, the remembering happens within the subject: he brings something back to his own mind.</p>`}
];

Object.entries(ALKITAAB_VERB_GROUPS).forEach(([number,groups])=>{
  const vocab=CHAPTERS[number].vocab,byId=new Map(vocab.map(word=>[word.id,word]));
  const anchors=new Map(groups.map(group=>[group.anchor,group]));
  const members=new Set(groups.flatMap(group=>group.ids)),ordered=[];
  vocab.forEach(word=>{
    const group=anchors.get(word.id);
    if(group){
      if(!members.has(word.id))ordered.push(word);
      group.ids.forEach(id=>ordered.push(byId.get(id)));
    }else if(!members.has(word.id))ordered.push(word);
  });
  ordered.forEach((word,index)=>{word.idInChapter=index+1});
  vocab.splice(0,vocab.length,...ordered);
});

function speakerIcon(){return `<svg class="icon-svg" viewBox="0 0 16 16" aria-hidden="true"><path d="M11.536 14.01A8.47 8.47 0 0 0 14.026 8a8.47 8.47 0 0 0-2.49-6.01l-1.06 1.06A6.98 6.98 0 0 1 12.526 8a6.98 6.98 0 0 1-2.05 4.95l1.06 1.06zM9.414 11.89A5.48 5.48 0 0 0 11.026 8a5.48 5.48 0 0 0-1.612-3.89l-1.06 1.06A3.99 3.99 0 0 1 9.526 8a3.99 3.99 0 0 1-1.172 2.83l1.06 1.06zM6.717 3.55A.5.5 0 0 1 7 4v8a.5.5 0 0 1-.812.39L3.825 10.5H1.5A1.5 1.5 0 0 1 0 9V7a1.5 1.5 0 0 1 1.5-1.5h2.325l2.363-1.89a.5.5 0 0 1 .529-.06z"/></svg>`}
function gearIcon(){return `<svg class="icon-svg" viewBox="0 0 16 16" aria-hidden="true"><path d="M9.405 1.05c-.413-1.4-2.397-1.4-2.81 0l-.1.34a1.46 1.46 0 0 1-2.105.87l-.31-.17c-1.283-.7-2.686.7-1.987 1.99l.17.31a1.46 1.46 0 0 1-.87 2.105l-.34.1c-1.4.413-1.4 2.397 0 2.81l.34.1a1.46 1.46 0 0 1 .87 2.105l-.17.31c-.7 1.283.7 2.686 1.99 1.987l.31-.17a1.46 1.46 0 0 1 2.105.87l.1.34c.413 1.4 2.397 1.4 2.81 0l.1-.34a1.46 1.46 0 0 1 2.105-.87l.31.17c1.283.7 2.686-.7 1.987-1.99l-.17-.31a1.46 1.46 0 0 1 .87-2.105l.34-.1c1.4-.413 1.4-2.397 0-2.81l-.34-.1a1.46 1.46 0 0 1-.87-2.105l.17-.31c.7-1.283-.7-2.686-1.99-1.987l-.31.17a1.46 1.46 0 0 1-2.105-.87l-.1-.34zM8 10.5a2.5 2.5 0 1 1 0-5 2.5 2.5 0 0 1 0 5z"/></svg>`}
function pencilIcon(){return `<svg class="icon-svg" viewBox="0 0 16 16" aria-hidden="true"><path d="M12.146.146a.5.5 0 0 1 .708 0l3 3a.5.5 0 0 1 0 .708L5.207 14.5H2a.5.5 0 0 1-.5-.5v-3.207L12.146.146zM11.207 2.5 13.5 4.793 14.793 3.5 12.5 1.207 11.207 2.5zM12.793 5.5 10.5 3.207 3 10.707V13h2.293l7.5-7.5z"/></svg>`}
function notecardIcon(){return `<svg class="icon-svg" viewBox="0 0 16 16" aria-hidden="true"><path d="M2 2.5A1.5 1.5 0 0 1 3.5 1h8A1.5 1.5 0 0 1 13 2.5V3h.5A1.5 1.5 0 0 1 15 4.5v8a1.5 1.5 0 0 1-1.5 1.5h-8A1.5 1.5 0 0 1 4 12.5V12h-.5A1.5 1.5 0 0 1 2 10.5v-8zM3.5 2a.5.5 0 0 0-.5.5v8a.5.5 0 0 0 .5.5H4V4.5A1.5 1.5 0 0 1 5.5 3H12v-.5a.5.5 0 0 0-.5-.5h-8zM5.5 4a.5.5 0 0 0-.5.5v8a.5.5 0 0 0 .5.5h8a.5.5 0 0 0 .5-.5v-8a.5.5 0 0 0-.5-.5h-8z"/></svg>`}
function filterIcon(){return `<svg class="icon-svg" viewBox="0 0 16 16" aria-hidden="true"><path d="M1.5 2.5A.5.5 0 0 1 2 2h12a.5.5 0 0 1 .39.812L9.5 8.925V13a.5.5 0 0 1-.276.447l-2 1A.5.5 0 0 1 6.5 14V8.925L1.61 2.812A.5.5 0 0 1 1.5 2.5zM3.04 3 7.5 8.575v4.616l1-.5V8.575L12.96 3H3.04z"/></svg>`}
function activeFilterCount(){return state.filters.collections.size+state.filters.chapters.size+state.filters.difficulties.size}
function studyHeaderActions(){let vocabulary=!state.lesson&&state.kind==='vocab',count=activeFilterCount();let filter=vocabulary?`<button class="header-filter" onclick="openFilterSheet()" aria-label="Filter vocabulary">${filterIcon()}${count?`<span class="filter-badge">${count}</span>`:''}</button>`:'';let mode=vocabulary?`<button class="header-mode" onclick="toggleVocabView()" aria-label="${state.vocabView==='card'?'Switch to list view':'Switch to card view'}">${state.vocabView==='card'?pencilIcon():notecardIcon()}</button>`:'';return `<div class="header-actions">${filter}${mode}<button class="header-gear" onclick="openSheet()" aria-label="Study options">${gearIcon()}</button></div>`}
function toggleVocabView(){state.vocabView=state.vocabView==='card'?'list':'card';localStorage.setItem('msa-vocab-view',state.vocabView);stopAudio();render()}
function listField(d,key,value,extra=''){let revealed=state.listReveals.has(`${d.id}:${key}`),isHidden=state.hide[key]&&!revealed;return `<span class="${extra} ${isHidden?'list-hidden':''}" ${isHidden?`onclick="revealListField(event,'${d.id}','${key}')" role="button" tabindex="0" aria-label="Reveal ${key==='en'?'English':key==='ar'?'Arabic':'transliteration'}"`:''}>${value}</span>`}
function vocabListView(){let settings=studyHeaderActions(),list=filteredVocabulary();app.innerHTML=header('Vocabulary','','',settings)+`<section class="vocab-list" aria-label="Vocabulary list">${list.map((d,i)=>`<div class="vocab-list-row" role="button" tabindex="0" onclick="speakListWord(${i})" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();speakListWord(${i})}">${listField(d,'en',d.en,'list-en')}${listField(d,'ar',arabic(d.ar),'list-ar')}${listField(d,'tr',d.tr,'list-tr')}</div>`).join('')}</section>`}
function revealListField(event,id,key){event.stopPropagation();state.listReveals.add(`${id}:${key}`);render()}
function speakListWord(index){if(state.hide.audio)return;let d=filteredVocabulary()[index];if(!d)return;playArabic(d)}
function audioButton(){return `<button class="card-audio ${state.hide.audio?'hidden-audio':''}" onclick="speak()" aria-label="Play audio">${speakerIcon()}</button>`}
function grammarNoteButton(d){return d?.grammarNote?`<button type="button" class="grammar-note-button" onclick="openGrammarNote(event)" aria-label="Open grammar note" title="Grammar note">!</button>`:''}
function activeGrammarNoteCard(){return state.view==='conversation-study'?currentConversation():current()}
function openGrammarNote(event){event?.stopPropagation();let d=activeGrammarNoteCard();if(!d?.grammarNote)return;grammarNoteDialog.innerHTML=`<button type="button" class="grammar-note-close" onclick="closeGrammarNote()" aria-label="Close grammar note">×</button><h2 id="grammarNoteTitle">Grammar Note</h2><div class="grammar-copy">${grammarText(d.grammarNote)}</div><button type="button" class="primary grammar-note-done" onclick="closeGrammarNote()">Done</button>`;grammarNoteDialog.classList.add('open');grammarNoteBackdrop.classList.add('open');grammarNoteDialog.querySelector('.grammar-note-close')?.focus()}
function closeGrammarNote(){grammarNoteDialog.classList.remove('open');grammarNoteBackdrop.classList.remove('open')}
function vocabCard(d){let hasForms=[d.f,d.mp,d.fp].some(form=>form&&form!=='—');return `<section class="study-card">${audioButton()}<div class="study-main"><div class="english ${hidden('en')}" onclick="revealCard('en')">${d.en}</div><div class="arabic ${hidden('ar')}" onclick="revealCard('ar')">${arabic(d.ar)}</div><div class="translit ${hidden('tr')}" onclick="revealCard('tr')">${d.tr}</div><div class="pos">${d.pos}</div></div>${hasForms?`<div class="forms"><div class="form">Feminine<span>${arabic(d.f)}</span></div><div class="form">Masc. Plural<span>${arabic(d.mp)}</span></div><div class="form">Fem. Plural<span>${arabic(d.fp)}</span></div></div>`:''}</section>`}
function sentenceCard(d){let displayedArabic=arabic(d.ar);return `<section class="study-card sentence">${audioButton()}${grammarNoteButton(d)}<div class="study-main"><div class="english ${hidden('en')}" onclick="revealCard('en')">${d.en}</div><div class="arabic ${hidden('ar')}" onclick="revealCard('ar')">${highlightNewWords(displayedArabic,state.collectionId,state.chapter)}</div><div class="translit ${hidden('tr')}" onclick="revealCard('tr')">${d.tr}</div></div></section>`}
function grammarText(text=''){return text.replace(/\[([^\]]+)\]/g,(_,value)=>`<span class="grammar-ar" lang="ar">${arabic(value)}</span>`)}
function grammarCard(d){return `<section class="study-card grammar-card"><div class="study-main"><div class="grammar-kicker">${d.type==='intro'?'Grammar focus':'Grammar note'}</div><h2 class="grammar-title">${d.title}</h2><div class="grammar-copy">${grammarText(d.body)}</div></div></section>`}
function rating(d){let r=state.ratings[d.id]||3;return `<p class="rating-label">How well do you know this word?</p><div class="ratings">${[5,4,3,2,1].map(n=>`<button type="button" class="rating ${r===n?'selected':''}" onclick="rate('${d.id}',${n})" aria-label="Set difficulty to ${n}">${n}</button>`).join('')}</div>`}
function rate(id,n){state.ratings[id]=n;localStorage.setItem('msa-ratings',JSON.stringify(state.ratings));let list=filteredVocabulary(),match=list.findIndex(word=>word.id===id);if(match>=0)state.index=match;else if(state.order==='shuffle'&&list.length){step(1);return}else state.index=Math.min(state.index,Math.max(0,list.length-1));saveVocabPosition();render()}
function saveVocabPosition(){let word=current();if(!word)return;let allIndex=ALL_V.findIndex(item=>item.id===word.id);if(allIndex<0)return;state.vocabIndex=allIndex;localStorage.setItem('msa-vocab-index',String(allIndex));localStorage.setItem('msa-vocab-id',word.id)}
// Track card IDs so rating changes cannot shift shuffle history to different words.
function resetShuffle(){let word=filteredVocabulary()[state.index];state.shuffleHistory=word?[word.id]:[];state.shuffleCursor=word?0:-1;state.shuffleSeen=new Set(word?[word.id]:[])}
function syncShuffleHistory(arr){let eligible=new Set(arr.map(word=>word.id));state.shuffleCursor=state.shuffleHistory.slice(0,state.shuffleCursor+1).filter(id=>eligible.has(id)).length-1;state.shuffleHistory=state.shuffleHistory.filter(id=>eligible.has(id))}
function shuffleNext(arr){let pool=arr.filter(word=>!state.shuffleSeen.has(word.id));if(!pool.length){state.shuffleSeen.clear();pool=arr;let last=state.shuffleHistory[state.shuffleCursor];if(arr.length>1)pool=arr.filter(word=>word.id!==last)}let word=pool[Math.floor(Math.random()*pool.length)];state.shuffleSeen.add(word.id);return word.id}
function step(dir){let arr=currentList();if(!arr.length)return;if(!state.lesson&&state.kind==='vocab'&&state.order==='shuffle'){syncShuffleHistory(arr);if(!state.shuffleHistory.length&&!state.shuffleSeen.size)resetShuffle();if(dir<0&&state.shuffleCursor>0){state.shuffleCursor--;state.index=arr.findIndex(word=>word.id===state.shuffleHistory[state.shuffleCursor])}else if(dir>0){if(state.shuffleCursor<state.shuffleHistory.length-1){state.shuffleCursor++}else{state.shuffleHistory.push(shuffleNext(arr));state.shuffleCursor=state.shuffleHistory.length-1}state.index=arr.findIndex(word=>word.id===state.shuffleHistory[state.shuffleCursor])}}else if(state.lesson&&dir>0&&state.index===arr.length-1){let order=['vocab','grammar','sentence'],next=order.slice(order.indexOf(state.kind)+1).find(kind=>sectionList(kind).length);if(next){state.kind=next;state.index=0;state.lastAutoKey=null}else state.index=0}else if(state.lesson&&dir<0&&state.index===0){let order=['vocab','grammar','sentence'],previous=order.slice(0,order.indexOf(state.kind)).reverse().find(kind=>sectionList(kind).length);if(previous){state.kind=previous;state.index=sectionList(previous).length-1;state.lastAutoKey=null}else state.index=arr.length-1}else state.index=(state.index+dir+arr.length)%arr.length;if(!state.lesson&&state.kind==='vocab')saveVocabPosition();render()}
function jumpTo(value){state.index=Math.max(0,Math.min(currentList().length-1,Number(value)-1));if(!state.lesson&&state.kind==='vocab'){saveVocabPosition();if(state.order==='shuffle')resetShuffle()}render()}
function enableSwipe(handler=step){let card=document.querySelector('.study-card'),startX=0,dragging=false;if(!card)return;card.addEventListener('pointerdown',e=>{if(e.target.closest('button'))return;dragging=true;startX=e.clientX;card.setPointerCapture(e.pointerId)});card.addEventListener('pointermove',e=>{if(!dragging)return;let dx=e.clientX-startX;card.style.transform=`translateX(${dx}px) rotate(${dx/28}deg)`;card.style.opacity=String(Math.max(.45,1-Math.abs(dx)/500))});card.addEventListener('pointerup',e=>{if(!dragging)return;dragging=false;let dx=e.clientX-startX;if(Math.abs(dx)>55){card.style.transform=`translateX(${dx<0?'-120%':'120%'}) rotate(${dx<0?-10:10}deg)`;card.style.opacity='0';setTimeout(()=>handler(dx>0?1:-1),150)}else{card.style.transform='';card.style.opacity='1'}});card.addEventListener('pointercancel',()=>{dragging=false;card.style.transform='';card.style.opacity='1'})}
function revealCard(key){if(!state.hide[key])return;state.cardReveals.add(cardRevealKey(key));render()}
function speak(){if(state.hide.audio||state.kind==='grammar')return;let d=current();if(d)playArabic(d)}
function openSheet(){let rows=[['en','◉','Hide English'],['ar','◉','Hide Arabic'],['tr','Tᵀ','Hide Transliteration'],['harakat','حَ','Hide Harakat'],['audio',speakerIcon(),'Hide Audio']];sheet.innerHTML=`<div class="handle"></div><h3>Study Options</h3>${rows.map(([k,ic,l])=>`<div class="option">${ic?`<span>${ic}</span>`:''}${l}<button type="button" class="switch ${state.hide[k]?'on':''}" onclick="toggle('${k}')" aria-label="${l}" aria-pressed="${state.hide[k]}"></button></div>`).join('')}${!state.lesson?`<h3>Order</h3><div class="order"><button class="${state.order==='chronological'?'active':''}" onclick="setOrder('chronological')">Chronological</button><button class="${state.order==='shuffle'?'active':''}" onclick="setOrder('shuffle')">⤨ Shuffle</button></div>`:''}`;sheet.classList.add('open');backdrop.classList.add('open')}
function filterChip(type,value,label=value){let active=state.filters[type].has(value),encoded=String(value).replace(/'/g,"\\'");return `<button type="button" class="filter-chip ${active?'active':''}" onclick="toggleFilter('${type}','${encoded}')" aria-pressed="${active}">${label}</button>`}
function populatedCollections(){return COLLECTIONS.filter(collection=>(collection.vocab?.length||0)>0||Object.values(collection.chapters).some(chapter=>chapter.vocab.length))}
function openFilterSheet(){let selected=populatedCollections().filter(collection=>state.filters.collections.has(collection.id)&&Object.keys(collection.chapters).length);let chapterSections=selected.length?selected.map(collection=>`<div class="filter-section"><h4>${collection.name}</h4><div class="filter-grid">${Object.entries(collection.chapters).filter(([,chapter])=>chapter.vocab.length).map(([number])=>filterChip('chapters',`${collection.id}:${number}`,`Chapter ${number}`)).join('')}</div></div>`).join(''):`<p class="filter-prompt">Select a collection with chapters to filter by chapter.</p>`;sheet.innerHTML=`<div class="handle"></div><h3>Filter Vocabulary</h3><div class="filter-section"><h4>Collections</h4><div class="filter-grid">${populatedCollections().map(collection=>filterChip('collections',collection.id,collection.name)).join('')}</div></div><div class="filter-section"><h3>Chapters</h3>${chapterSections}</div><div class="filter-section"><h4>Difficulty</h4><div class="filter-grid">${[1,2,3,4,5].map(number=>filterChip('difficulties',number,String(number))).join('')}</div></div><div class="filter-footer"><button class="secondary" onclick="clearFilters()">Clear All</button><button class="primary" onclick="closeSheet()">Done · ${filteredVocabulary().length} words</button></div>`;sheet.classList.add('open');backdrop.classList.add('open')}
function saveFilters(){localStorage.setItem('mosa-vocab-filters',JSON.stringify({collections:[...state.filters.collections],chapters:[...state.filters.chapters],difficulties:[...state.filters.difficulties]}))}
function toggleFilter(type,value){let parsed=type==='difficulties'?Number(value):value,set=state.filters[type],preferred=current()?.id;if(set.has(parsed)){set.delete(parsed);if(type==='collections')for(let chapter of [...state.filters.chapters])if(chapter.startsWith(`${parsed}:`))state.filters.chapters.delete(chapter)}else set.add(parsed);saveFilters();let list=filteredVocabulary(),match=list.findIndex(word=>word.id===preferred);state.index=match>=0?match:0;resetShuffle();openFilterSheet()}
function clearFilters(renderStudy=false){for(let set of Object.values(state.filters))set.clear();saveFilters();let saved=ALL_V[state.vocabIndex];state.index=Math.max(0,filteredVocabulary().findIndex(word=>saved&&word.id===saved.id));resetShuffle();if(renderStudy){closeSheet(false);render()}else openFilterSheet()}
function vocabFilterEmpty(){app.innerHTML=header('Vocabulary','','',studyHeaderActions())+`<section class="filter-empty"><h2>No matching words</h2><p>No vocabulary matches all of the selected filters.</p><button class="primary" onclick="clearFilters(true)">Clear Filters</button></section>`}
function closeSheet(update=true){sheet.classList.remove('open');backdrop.classList.remove('open');if(update)render()};backdrop.onclick=()=>closeSheet();document.addEventListener('keydown',event=>{if(event.key==='Escape')closeGrammarNote()});
function toggle(k){state.hide[k]=!state.hide[k];if(['en','ar','tr'].includes(k)){for(let reveal of [...state.listReveals])if(reveal.endsWith(`:${k}`))state.listReveals.delete(reveal);for(let reveal of [...state.cardReveals])if(reveal.endsWith(`:${k}`))state.cardReveals.delete(reveal)}localStorage.setItem('msa-study-options',JSON.stringify(state.hide));openSheet()}
function setOrder(o){if(state.order!==o){state.order=o;if(o==='shuffle')resetShuffle()}openSheet()}
function empty(){app.innerHTML=header(state.tab[0].toUpperCase()+state.tab.slice(1),'',state.tab==='lessons'?"state.view='collections';render()":'')+`<section class="empty"><div><div class="cone">🚧</div><h2>In Progress</h2><p>This section is currently under construction. Check back soon!</p></div></section>`}
render();
if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}))}
  </script>
