const nav=[['home','⌂','Home'],['lessons','🎓','Lessons'],['vocabulary','▤','Vocabulary'],['settings','⚙','Settings'],['editor','✎','Editor']];
function tabs(){bottom.innerHTML=nav.map(([id,ic,l])=>`<button class="tab ${state.tab===id?'active':''}" onclick="go('${id}')"><span>${ic}</span>${l}</button>`).join('')}
function header(title,sub='',back='',action=''){return `<div class="top">${back?`<button class="back" onclick="${back}" aria-label="Back">‹</button>`:''}<div><h1>${title}</h1>${sub?`<p>${sub}</p>`:''}</div>${action}</div>`}
function go(tab){if(state.tab==='vocabulary'&&!state.lesson&&state.kind==='vocab')saveVocabPosition();state.tab=tab;state.options=false;if(tab==='home')state.view='home';if(tab==='lessons')state.view='collections';if(tab==='vocabulary'){state.view='study';state.lesson=false;state.kind='vocab';state.index=state.vocabIndex}if(tab==='settings'||tab==='editor')state.view='empty';render()}
function render(){tabs();closeSheet(false);if(state.view==='home')home();else if(state.view==='collections')collectionsView();else if(state.view==='chapters')chapters();else if(state.view==='overview')overview();else if(state.view==='study')study();else empty()}
function home(){app.innerHTML=`<section class="hero"><h1>MSA Arabic</h1><p>Learn · Practice · Explore</p></section><div class="grid">${[['lessons','📖','Lessons','Continue learning'],['vocabulary','▣','Vocabulary','Practice your words'],['settings','⚙','Settings','Customize the app'],['editor','✎','Editor','Manage content']].map(x=>`<button class="home-card" onclick="go('${x[0]}')"><span class="icon">${x[1]}</span><strong>${x[2]}</strong><small>${x[3]}</small></button>`).join('')}</div>`}
function collectionsView(){app.innerHTML=header('Lessons','Choose a collection to begin')+`<div class="list">${collections.map((c,i)=>`<button class="row" onclick="${i===0?"state.view='chapters';render()":"state.view='empty';render()"}"><span class="row-icon">${i===0?'📖':'🚧'}</span><span><strong>${c}</strong><small>${i===0?'13 Chapters':'In Progress'}</small></span><span class="chev">›</span></button>`).join('')}</div>`}
function chapters(){app.innerHTML=header('Al-Kitaab (Part 1)','Select a chapter',"state.view='collections';render()")+`<div class="list">${Array.from({length:13},(_,i)=>i+1).map(n=>{let ready=!!CHAPTERS[n],c=CHAPTERS[n];return `<button class="row ${ready?'active':''}" onclick="${ready?`state.chapter=${n};state.view='overview';render()`:"state.view='empty';render()"}"><span class="row-icon">${ready?'📖':'🚧'}</span><span><strong>Chapter ${n}</strong><small>${ready?`Vocabulary · ${c.vocab.length} words<br>Sentences · ${c.sentences.length} sentences`:'In Progress'}</small></span></button>`}).join('')}</div>`}
function overview(){let c=CHAPTERS[state.chapter];app.innerHTML=header(`Chapter ${state.chapter}`,'',"state.view='chapters';render()")+`<section class="overview"><div class="book">📖</div><h2>Chapter ${state.chapter}</h2><p>${c.subtitle}</p><div class="stats"><div class="stat"><b>${c.vocab.length}</b><small>Vocabulary Words</small></div><div class="stat"><b>${c.sentences.length}</b><small>Sample Sentences</small></div></div><button class="primary" style="width:100%" onclick="startLesson()">▶ &nbsp; Start Lesson</button><div class="learn"><strong>What you’ll learn:</strong><ul>${c.learn.map(x=>`<li>${x}</li>`).join('')}</ul></div></section>`}
function startLesson(){state.lesson=true;state.kind='vocab';state.index=0;state.view='study';render()}
function currentList(){if(!state.lesson)return ALL_V;let c=CHAPTERS[state.chapter];return state.kind==='vocab'?c.vocab:c.sentences}
function current(){return currentList()[state.index]}
function hidden(key){return state.hide[key]?'hidden-item':''}
function study(){let d=current(),total=currentList().length;let slider=state.lesson?`<div class="scrubber"><input type="range" min="1" max="${total}" value="${state.index+1}" onchange="jumpTo(this.value)" aria-label="Card position"><div class="scrubber-labels"><span>1</span><span>${total}</span></div></div>`:'';let settings=`<button class="header-gear" onclick="openSheet()" aria-label="Study options">${gearIcon()}</button>`;app.innerHTML=header(state.lesson?`Chapter ${state.chapter} – ${state.kind==='vocab'?'Vocabulary':'Sentences'}`:'Vocabulary','',state.lesson?"state.view='overview';render()":'',settings)+`${state.kind==='vocab'?vocabCard(d):sentenceCard(d)}${slider}<div class="actions"><button class="secondary" onclick="step(1)">Skip</button><button class="primary" onclick="speak()">Replay</button></div>${!state.lesson&&state.kind==='vocab'?rating(d):''}`;enableSwipe();let autoKey=`${state.lesson?`lesson-${state.chapter}`:'vocabulary'}:${state.kind}:${state.index}`;if(!state.hide.audio&&state.lastAutoKey!==autoKey){state.lastAutoKey=autoKey;setTimeout(speak,180)}}
function speakerIcon(){return `<svg class="icon-svg" viewBox="0 0 16 16" aria-hidden="true"><path d="M11.536 14.01A8.47 8.47 0 0 0 14.026 8a8.47 8.47 0 0 0-2.49-6.01l-1.06 1.06A6.98 6.98 0 0 1 12.526 8a6.98 6.98 0 0 1-2.05 4.95l1.06 1.06zM9.414 11.89A5.48 5.48 0 0 0 11.026 8a5.48 5.48 0 0 0-1.612-3.89l-1.06 1.06A3.99 3.99 0 0 1 9.526 8a3.99 3.99 0 0 1-1.172 2.83l1.06 1.06zM6.717 3.55A.5.5 0 0 1 7 4v8a.5.5 0 0 1-.812.39L3.825 10.5H1.5A1.5 1.5 0 0 1 0 9V7a1.5 1.5 0 0 1 1.5-1.5h2.325l2.363-1.89a.5.5 0 0 1 .529-.06z"/></svg>`}
function gearIcon(){return `<svg class="icon-svg" viewBox="0 0 16 16" aria-hidden="true"><path d="M9.405 1.05c-.413-1.4-2.397-1.4-2.81 0l-.1.34a1.46 1.46 0 0 1-2.105.87l-.31-.17c-1.283-.7-2.686.7-1.987 1.99l.17.31a1.46 1.46 0 0 1-.87 2.105l-.34.1c-1.4.413-1.4 2.397 0 2.81l.34.1a1.46 1.46 0 0 1 .87 2.105l-.17.31c-.7 1.283.7 2.686 1.99 1.987l.31-.17a1.46 1.46 0 0 1 2.105.87l.1.34c.413 1.4 2.397 1.4 2.81 0l.1-.34a1.46 1.46 0 0 1 2.105-.87l.31.17c1.283.7 2.686-.7 1.987-1.99l-.17-.31a1.46 1.46 0 0 1 .87-2.105l.34-.1c1.4-.413 1.4-2.397 0-2.81l-.34-.1a1.46 1.46 0 0 1-.87-2.105l.17-.31c.7-1.283-.7-2.686-1.99-1.987l-.31.17a1.46 1.46 0 0 1-2.105-.87l-.1-.34zM8 10.5a2.5 2.5 0 1 1 0-5 2.5 2.5 0 0 1 0 5z"/></svg>`}
function audioButton(){return `<button class="card-audio ${state.hide.audio?'hidden-audio':''}" onclick="speak()" aria-label="Play audio">${speakerIcon()}</button>`}
function vocabCard(d){let hasForms=[d.f,d.mp,d.fp].some(form=>form&&form!=='—');return `<section class="study-card">${audioButton()}<div class="study-main"><div class="english ${hidden('en')}" onclick="reveal('en')">${d.en}</div><div class="arabic ${hidden('ar')}" onclick="reveal('ar')">${d.ar}</div><div class="translit ${hidden('tr')}" onclick="reveal('tr')">${d.tr}</div><div class="pos">${d.pos}</div></div>${hasForms?`<div class="forms"><div class="form">Feminine<span>${d.f}</span></div><div class="form">Masc. Plural<span>${d.mp}</span></div><div class="form">Fem. Plural<span>${d.fp}</span></div></div>`:''}</section>`}
function sentenceCard(d){return `<section class="study-card sentence">${audioButton()}<div class="study-main"><div class="english ${hidden('en')}" onclick="reveal('en')">${d.en}</div><div class="arabic ${hidden('ar')}" onclick="reveal('ar')">${d.ar}</div><div class="translit ${hidden('tr')}" onclick="reveal('tr')">${d.tr}</div></div></section>`}
function rating(d){let r=state.ratings[d.id]||3;return `<p class="rating-label">How well do you know this word?</p><div class="ratings">${[5,4,3,2,1].map(n=>`<button class="rating ${r===n?'selected':''}" onclick="rate(${d.id},${n})">${n}</button>`).join('')}</div>`}
function rate(id,n){state.ratings[id]=n;localStorage.setItem('msa-ratings',JSON.stringify(state.ratings));render()}
function saveVocabPosition(){state.vocabIndex=state.index;localStorage.setItem('msa-vocab-index',String(state.vocabIndex))}
function weightedNext(){let pool=[];ALL_V.forEach((v,i)=>{let w=2**((state.ratings[v.id]||3)-1);for(let j=0;j<w;j++)pool.push(i)});let next=state.index;while(next===state.index&&ALL_V.length>1)next=pool[Math.floor(Math.random()*pool.length)];return next}
function step(dir){let arr=currentList();if(!state.lesson&&state.kind==='vocab'&&state.order==='shuffle'){if(dir<0&&state.shuffleCursor>0){state.shuffleCursor--;state.index=state.shuffleHistory[state.shuffleCursor]}else if(dir>0){if(state.shuffleCursor<state.shuffleHistory.length-1){state.shuffleCursor++;state.index=state.shuffleHistory[state.shuffleCursor]}else{state.index=weightedNext();state.shuffleHistory.push(state.index);state.shuffleCursor=state.shuffleHistory.length-1}}}else state.index=(state.index+dir+arr.length)%arr.length;if(state.lesson&&state.kind==='vocab'&&dir>0&&state.index===0){state.kind='sentence';state.index=0}if(!state.lesson&&state.kind==='vocab')saveVocabPosition();render()}
function jumpTo(value){state.index=Math.max(0,Math.min(currentList().length-1,Number(value)-1));if(!state.lesson&&state.kind==='vocab'){saveVocabPosition();if(state.order==='shuffle'){state.shuffleHistory=[state.index];state.shuffleCursor=0}}render()}
function enableSwipe(){let card=document.querySelector('.study-card'),startX=0,dragging=false;if(!card)return;card.addEventListener('pointerdown',e=>{if(e.target.closest('button'))return;dragging=true;startX=e.clientX;card.setPointerCapture(e.pointerId)});card.addEventListener('pointermove',e=>{if(!dragging)return;let dx=e.clientX-startX;card.style.transform=`translateX(${dx}px) rotate(${dx/28}deg)`;card.style.opacity=String(Math.max(.45,1-Math.abs(dx)/500))});card.addEventListener('pointerup',e=>{if(!dragging)return;dragging=false;let dx=e.clientX-startX;if(Math.abs(dx)>55){card.style.transform=`translateX(${dx<0?'-120%':'120%'}) rotate(${dx<0?-10:10}deg)`;card.style.opacity='0';setTimeout(()=>step(dx>0?1:-1),150)}else{card.style.transform='';card.style.opacity='1'}});card.addEventListener('pointercancel',()=>{dragging=false;card.style.transform='';card.style.opacity='1'})}
function reveal(key){state.hide[key]=false;render()}
function speak(){if(state.hide.audio)return;let d=current();speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(d.ar);u.lang='ar-SA';u.rate=.78;speechSynthesis.speak(u)}
function openSheet(){let rows=[['en','◉','Hide English'],['ar','◉','Hide Arabic'],['tr','Tᵀ','Hide Transliteration'],['audio',speakerIcon(),'Hide Audio']];sheet.innerHTML=`<div class="handle"></div><h3>Study Options</h3>${rows.map(([k,ic,l])=>`<div class="option">${ic?`<span>${ic}</span>`:''}${l}<button class="switch ${state.hide[k]?'on':''}" onclick="toggle('${k}')" aria-label="${l}"></button></div>`).join('')}${!state.lesson?`<h3>Order</h3><div class="order"><button class="${state.order==='chronological'?'active':''}" onclick="setOrder('chronological')">Chronological</button><button class="${state.order==='shuffle'?'active':''}" onclick="setOrder('shuffle')">⤨ Shuffle</button></div>`:''}`;sheet.classList.add('open');backdrop.classList.add('open')}
function closeSheet(update=true){sheet.classList.remove('open');backdrop.classList.remove('open');if(update)render()};backdrop.onclick=()=>closeSheet();
function toggle(k){state.hide[k]=!state.hide[k];openSheet()}
function setOrder(o){state.order=o;if(o==='shuffle'){state.shuffleHistory=[state.index];state.shuffleCursor=0}openSheet()}
function empty(){app.innerHTML=header(state.tab[0].toUpperCase()+state.tab.slice(1),'',state.tab==='lessons'?"state.view='collections';render()":'')+`<section class="empty"><div><div class="cone">🚧</div><h2>In Progress</h2><p>This section is currently under construction. Check back soon!</p></div></section>`}
render();
if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}))}
  </script>
</body>
</html>
