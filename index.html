const G1=[
{id:'c1-g1',type:'intro',title:'Grammar Lesson Overview',body:`<p>In this lesson, we will discuss nouns, adjectives, and common question words (interrogatives).</p><p>Nouns have four traits that can affect their form: gender, definiteness, quantity, and case. We will focus only on gender and definiteness in this lesson.</p><p>Adjectives in a noun–adjective phrase must match the noun’s gender and definiteness.</p><p>Questions may begin with a question particle. In questions containing a prepositional phrase, the preposition comes first.</p><p>We’ll look at each of these ideas in more detail next.</p>`},
{id:'c1-g2',type:'note',title:'Gender',body:`<p>There are two genders: masculine [مُذَكَّر] (mudhakkar) and feminine [مُؤَنَّث] (muʾannath).</p><p>Feminine nouns can often be identified by a <em>tāʾ marbūṭa</em> [ة], although there are exceptions.</p><p>Human nouns take the gender of the person to whom they refer—for example, father [أَب] and mother [أُمّ]. Inanimate nouns have a fixed grammatical gender—for example, book [كِتاب] is masculine and school [مَدْرَسة] is feminine. Arabic has no neuter pronoun equivalent to “it,” so nonhuman nouns are referred to with he [هُوَ] (huwa) when masculine and she [هِيَ] (hiya) when feminine.</p><p>In a noun–adjective phrase, the noun comes first and the adjective follows its gender: new male student [طالِب جَديد], new female student [طالِبة جَديدة], big house [بَيْت كَبير], and small school [مَدْرَسة صَغيرة].</p>`},
{id:'c1-g3',type:'note',title:'Definiteness',body:`<p>In English, a noun may use the definite article “the,” the indefinite article “a/an,” or no article. Arabic has one definite article [الـ]. When English uses “a/an,” Arabic normally uses no article.</p><p>As with gender, an adjective in a noun–adjective phrase matches the noun’s definiteness. Both words therefore take the definite article in “the new book” [الكِتاب الجَديد].</p>`},
{id:'c1-g4',type:'note',title:'Nisba Adjectives',body:`<p>A nisba adjective expresses origin or association—for example, Egyptian student [طالِب مِصْريّ] and American coffee [قَهْوة أَمْريكيّة]. A phrase such as “library book” is normally expressed with a different structure: book from the library [كِتاب مِنَ المَكْتَبة].</p><p>Nisba adjectives are commonly formed with the suffix [ـِيّ] for masculine nouns and [ـِيّة] for feminine nouns.</p><p>Depending on the base word, forming the nisba may require dropping the definite article, removing a final <em>tāʾ marbūṭa</em>, or removing a final <em>alif</em> [ا]. Examples include French girl [فَتاة فَرَنْسِيّة], the American book [الكِتاب الأَمْريكيّ], and Turkish coffee [قَهْوة تُرْكِيّة].</p>`},
{id:'c1-g5',type:'note',title:'Interrogatives and Prepositional Phrases',body:`<p>In questions containing a prepositional phrase, the preposition comes first and the question word follows it.</p><p>Where are you from? [مِن أَيْنَ أَنْتَ؟]</p><p>In which city do you live? [في أَيِّ مَدينةٍ تَسْكُنُ؟]</p><p>Which street do you live on? [في أَيِّ شارِعٍ تَسْكُنُ؟]</p><p>With whom do you work? [مَعَ مَنْ تَعْمَلُ؟]</p>`},
{id:'c1-g6',type:'note',title:'Choosing “What” and Using هَلْ',body:`<p>Two common ways to ask “what” are [أَيّ] (ayy), used directly before a noun—as in “what/which car?” [أَيُّ سَيّارةٍ؟]—and [ماذا] (mādhā), used before a verb—as in “what are you doing?” [ماذا تَفْعَلُ؟]</p><p>When a question expects a binary answer—such as yes or no, or one option versus another—it can begin with [هَلْ]. For example: “Are you a student?” [هَلْ أَنْتَ طالِبٌ؟] and “Are you a student or a professor?” [هَلْ أَنْتَ طالِبٌ أَمْ أُسْتاذٌ؟]</p>`}

function filterChip(type,value,label=value){let active=state.filters[type].has(value),encoded=String(value).replace(/'/g,"\\'");return `<button type="button" class="filter-chip ${active?'active':''}" onclick="toggleFilter('${type}','${encoded}')" aria-pressed="${active}">${label}</button>`}
function populatedCollections(){return COLLECTIONS.filter(collection=>Object.values(collection.chapters).some(chapter=>chapter.vocab.length))}
function openFilterSheet(){let selected=populatedCollections().filter(collection=>state.filters.collections.has(collection.id));let chapterSections=selected.length?selected.map(collection=>`<div class="filter-section"><h4>${collection.name}</h4><div class="filter-grid">${Object.entries(collection.chapters).filter(([,chapter])=>chapter.vocab.length).map(([number])=>filterChip('chapters',`${collection.id}:${number}`,`Chapter ${number}`)).join('')}</div></div>`).join(''):`<p class="filter-prompt">Select one or more collections above to choose specific chapters.</p>`;sheet.innerHTML=`<div class="handle"></div><h3>Filter Vocabulary</h3><div class="filter-section"><h4>Collections</h4><div class="filter-grid">${populatedCollections().map(collection=>filterChip('collections',collection.id,collection.name)).join('')}</div></div><div class="filter-section"><h3>Chapters</h3>${chapterSections}</div><div class="filter-section"><h4>Difficulty</h4><div class="filter-grid">${[1,2,3,4,5].map(number=>filterChip('difficulties',number,String(number))).join('')}</div></div><div class="filter-footer"><button class="secondary" onclick="clearFilters()">Clear All</button><button class="primary" onclick="closeSheet()">Done · ${filteredVocabulary().length} words</button></div>`;sheet.classList.add('open');backdrop.classList.add('open')}
function saveFilters(){localStorage.setItem('mosa-vocab-filters',JSON.stringify({collections:[...state.filters.collections],chapters:[...state.filters.chapters],difficulties:[...state.filters.difficulties]}))}
function toggleFilter(type,value){let parsed=type==='difficulties'?Number(value):value,set=state.filters[type],preferred=current()?.id;if(set.has(parsed)){set.delete(parsed);if(type==='collections')for(let chapter of [...state.filters.chapters])if(chapter.startsWith(`${parsed}:`))state.filters.chapters.delete(chapter)}else set.add(parsed);saveFilters();let list=filteredVocabulary(),match=list.findIndex(word=>word.id===preferred);state.index=match>=0?match:0;state.shuffleHistory=[];state.shuffleCursor=-1;openFilterSheet()}
function clearFilters(renderStudy=false){for(let set of Object.values(state.filters))set.clear();saveFilters();let saved=ALL_V[state.vocabIndex];state.index=Math.max(0,filteredVocabulary().findIndex(word=>saved&&word.id===saved.id));state.shuffleHistory=[];state.shuffleCursor=-1;if(renderStudy){closeSheet(false);render()}else openFilterSheet()}
function vocabFilterEmpty(){app.innerHTML=header('Vocabulary','','',studyHeaderActions())+`<section class="filter-empty"><h2>No matching words</h2><p>No vocabulary matches all of the selected filters.</p><button class="primary" onclick="clearFilters(true)">Clear Filters</button></section>`}
function closeSheet(update=true){sheet.classList.remove('open');backdrop.classList.remove('open');if(update)render()};backdrop.onclick=()=>closeSheet();
function toggle(k){state.hide[k]=!state.hide[k];if(['en','ar','tr'].includes(k)){for(let reveal of [...state.listReveals])if(reveal.endsWith(`:${k}`))state.listReveals.delete(reveal);for(let reveal of [...state.cardReveals])if(reveal.endsWith(`:${k}`))state.cardReveals.delete(reveal)}localStorage.setItem('msa-study-options',JSON.stringify(state.hide));openSheet()}
function setOrder(o){state.order=o;if(o==='shuffle'){state.shuffleHistory=[state.index];state.shuffleCursor=0}openSheet()}
function empty(){app.innerHTML=header(state.tab[0].toUpperCase()+state.tab.slice(1),'',state.tab==='lessons'?"state.view='collections';render()":'')+`<section class="empty"><div><div class="cone">🚧</div><h2>In Progress</h2><p>This section is currently under construction. Check back soon!</p></div></section>`}
render();
if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}))}
  </script>
